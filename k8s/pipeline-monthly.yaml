# Monthly CBSL macro ingestion (CCPI + MEI) — the Kubernetes port of the
# local run-monthly.sh. Unlike that script, NO password lives in this file:
# credentials come from the agri-db secret. (The old run-monthly.sh hardcodes
# the DB password and should be retired — and that password rotated — once
# this CronJob is live.)
#
# "No new bulletin since watermark" is a legitimate SUCCESS with zero new
# rows: CCPI/MEI publish monthly, so most runs between releases find nothing.
#
# LIVE SCHEDULE since the 2026-07-26 cutover. The manifest must say
# suspend: false — `kubectl apply` overwrites any live patch, so a manifest
# still saying true silently re-suspends the schedule on the next apply.
#
# INCIDENT + FIX (2026-08-16): the FIRST-EVER run (2026-08-01) OOMKilled at
# the old 768Mi limit after ~24 minutes, because ingest_cbsl_macro.py had NO
# real watermark despite its old docstring's claim — every run re-scraped,
# re-downloaded and re-parsed the ENTIRE CCPI+MEI corpus (~65 artifacts,
# 2020-04→present and growing every month), a cost that only ever goes up.
# Fixed in ingest_cbsl_macro.py: a DB-driven watermark (loader.get_watermarks())
# now skips already-covered artifacts BEFORE download/parse (1-month safety
# overlap; the upsert is idempotent so re-parsing the overlap is harmless),
# and each artifact is parsed+upserted immediately rather than accumulated
# into one big list first, so peak memory no longer grows with total corpus
# size. Resources raised below to safely absorb the one-off catch-up run
# (DB was left ~2 months stale by the outage) and any future --full backfill,
# with real headroom rather than a tight fit.
#
# RESOURCES + SECURITY CONTEXT: same reasoning/tiers as pipeline-daily.yaml's
# python steps (see its header) -- a bit more headroom here because
# ingest_cbsl_macro.py parses PDFs (pdfplumber), which is more memory-hungry
# per page than the plain DB-I/O steps. No non-root user in agriforecast-ml
# (python:3.12-slim, verified root by default) so runAsNonRoot is honestly
# left unset; allowPrivilegeEscalation/capabilities are still hardened.
# No SQL cold-start init container here -- CCPI/MEI is not perishable the
# way daily DEC prices are (see header above), so a bounded wait matters far
# less than on the nightly job; adding one is a cheap future follow-up if it
# turns out to matter in practice.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: monthly-cbsl-macro
  namespace: agriforecast
  labels:
    app: monthly-cbsl-macro
    app.kubernetes.io/part-of: agriforecast
spec:
  schedule: "0 21 1 * *" # 1st of the month, 21:00 Colombo
  timeZone: "Asia/Colombo"
  suspend: false # live since the 2026-07-26 cutover — see header
  concurrencyPolicy: Forbid
  # Monthly data is not perishable the way daily DEC prices are (the bulletin
  # stays on the CBSL site), but a generous window still catches a sleeping
  # machine.
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: monthly-cbsl-macro
        spec:
          restartPolicy: Never
          containers:
            - name: ingest-cbsl-macro
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "ingest_cbsl_macro.py"]
              envFrom:
                - secretRef: { name: agri-db }
              env:
                - name: AGRI_DB_HOST
                  value: host.docker.internal # host-level sql_server_container
              resources:
                requests: { memory: "512Mi", cpu: "100m" }
                limits: { memory: "1.5Gi", cpu: "500m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
