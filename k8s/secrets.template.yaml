# ============================================================================
# TEMPLATE ONLY — DO NOT put real values in this file and DO NOT apply it.
#
# This file documents the SHAPE of the secrets the manifests expect.
# Real secrets are created by ./k8s/create-secrets.sh, which reads the
# gitignored src/AgriForecast.ML/.env (DB creds + ML admin key) and prompts
# for the JWT key. No secret value may ever be committed to this repo.
#
# If you accidentally `kubectl apply -f k8s/` and clobber the real secrets
# with these placeholders, just re-run ./k8s/create-secrets.sh — it is
# idempotent and will restore the real values.
# ============================================================================
---
# agri-db — SQL Server credentials. Mirrors the AGRI_DB_* keys in
# src/AgriForecast.ML/.env (single source of truth; survives rotations by
# re-running create-secrets.sh). AGRI_DB_HOST is stored as-is but every
# manifest OVERRIDES the host to host.docker.internal, because from inside
# the cluster that is how pods reach the host-level sql_server_container
# on port 1434.
apiVersion: v1
kind: Secret
metadata:
  name: agri-db
  namespace: agriforecast
type: Opaque
stringData:
  AGRI_DB_HOST: "REPLACE_ME"      # e.g. localhost (manifests override to host.docker.internal)
  AGRI_DB_PORT: "REPLACE_ME"      # e.g. 1434
  AGRI_DB_NAME: "REPLACE_ME"      # e.g. AgriForecast
  AGRI_DB_USER: "REPLACE_ME"
  AGRI_DB_PASSWORD: "REPLACE_ME"
---
# agri-jwt — the API's JWT signing key (currently held in .NET user-secrets
# for the host-run dev API; the cluster API gets it from here). Must be
# >= 32 bytes or the API refuses to start (F-12).
apiVersion: v1
kind: Secret
metadata:
  name: agri-jwt
  namespace: agriforecast
type: Opaque
stringData:
  JWT_KEY: "REPLACE_ME"
---
# agri-ml-key — shared admin key between the API (MlService__AdminApiKey)
# and the ML service (ML_ADMIN_API_KEY). The two sides must hold the SAME
# value (F-02).
apiVersion: v1
kind: Secret
metadata:
  name: agri-ml-key
  namespace: agriforecast
type: Opaque
stringData:
  ML_ADMIN_API_KEY: "REPLACE_ME"
---
# agri-smtp — OPTIONAL. The mailbox the nightly pipeline sentinel sends from
# when a night was not green. Every reference to it in forecast-api.yaml is
# marked `optional: true`, so if this secret does not exist the API still runs
# normally and simply logs that the sentinel is disabled.
# SMTP_PASSWORD is a Gmail APP PASSWORD (myaccount.google.com -> Security ->
# 2-Step Verification -> App passwords), never the account password.
apiVersion: v1
kind: Secret
metadata:
  name: agri-smtp
  namespace: agriforecast
type: Opaque
stringData:
  SMTP_USER: "REPLACE_ME"      # the Gmail address that authenticates + sends
  SMTP_FROM: "REPLACE_ME"      # normally the same address (Gmail rewrites others)
  SMTP_TO: "REPLACE_ME"        # recipient; comma-separated list allowed
  SMTP_PASSWORD: "REPLACE_ME"  # 16-character Gmail app password
