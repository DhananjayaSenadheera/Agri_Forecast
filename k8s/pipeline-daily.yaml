# Daily data pipeline — the Kubernetes port of run-daily.sh (launchd, 16:30 UK
# = 21:00 Colombo). Seven sequential steps with the SAME ordering and the SAME
# verify gate:
#
#   [0] wait-for-sql          <- SQL COLD-START GATE (PR #62 declared follow-up):
#                                 bounded TCP poll of
#                                 host.docker.internal:$AGRI_DB_PORT (the same
#                                 agri-db secret every other step reads, not
#                                 hardcoded) so a dead/not-yet-up DB fails
#                                 visibly here (exit 1, ~5 min ceiling) instead
#                                 of the old failure mode -- ingestion dying
#                                 immediately against a cold DB with no retry
#                                 (backoffLimit: 0). Does not replace `docker
#                                 update --restart unless-stopped
#                                 sql_server_container` (still the fix for the
#                                 DB not being up at all); this is the bounded
#                                 wait for "up but not ready yet".
#   [1] ingestion (market+weather, .NET worker, Ingestion__RunOnce=true baked)
#   [2] mirror_dec_prices.py   (DAMBULLA_DEC -> PriceObservations)
#   [3] verify_ingestion.py    <- THE GATE: non-zero exit fails the pod here,
#                                 so invalid data NEVER reaches news/sentiment/
#                                 build_features (same semantics as run-daily's
#                                 set -e abort)
#   [4] ingest_news.py
#   [5] score_news.py
#   [6] build_features.py  (main container — the payload). build_features.py
#       now runs qa_features' check suite ITSELF, after persisting
#       CropFeatureDaily but before marking the FEATURE_BUILD run row
#       Succeeded (see build_features.py's `_run_qa_gate` docstring) -- NOT a
#       separate `&& qa_features.py` step in this manifest. A deliberately
#       FAILED check marks that row Failed and the container exits non-zero
#       (Job Failed); the Failed row then shows up in the admin ingestion
#       runs table at /admin/ingestion (unfiltered by default) -- it does
#       NOT flip that page's status card/banner, which deliberately excludes
#       Source='FEATURE_BUILD' from state/lastRunStatus by design (see
#       IngestionSources.ExcludedFromServiceState -- the feature build runs
#       last every day, so including it there would permanently mask a
#       failed DAMBULLA_DEC/WEATHER/ECONOMIC/NEWS run). It ALSO surfaces on
#       GET /api/admin/pipeline/health (reads the FEATURE_BUILD row directly;
#       a Failed row = state "failed" = the red admin-wide pipeline banner).
#       The literal "/health" route is only a static liveness ping for k8s
#       probes. A CRASH inside the QA harness itself
#       (a bug, not a failed check) is fail-open and does not touch the row.
#       Still DETECTION not PREVENTION: the bad row is already in
#       CropFeatureDaily by the time the gate runs -- it does not block the
#       write, only makes it visible on the runs table. Known gap: TC5/TC5b's
#       leakage check covers 42 of 76 feature columns (missing
#       festivals/macro/price_obs/market_slugs) -- see qa_features.py's
#       header.
#   [6b] trigger_forecast_snapshot.py -- runs in the SAME build-features
#       container, AFTER build_features.py exits 0 (see the container's shell
#       wrapper below). PRD farmer-portfolio-and-forecast-snapshots.md 4.2,
#       CORRECTED 2026-07-27: the snapshot/mature passes read CropFeatureDaily,
#       which is only current once build_features has run, so this step MUST
#       come after it, not "last in the .NET Worker pass" as the PRD originally
#       (wrongly) specced. It makes ONE HTTP POST to ml-serving's
#       /admin/snapshot-forecasts (the in-cluster ClusterIP service -- the
#       promoted model payload lives there, never re-implemented here) with an
#       EMPTY body (no snapshotDate -- the service defaults to its own
#       date.today(); a watermark-derived date would 422 forever after any
#       outage longer than the service's SNAPSHOT_MATURE_GRACE_DAYS and stop
#       maturing). It writes ONE IngestionRuns row, Source='FORECAST_SNAPSHOT'
#       (IngestionSources.FORECAST_SNAPSHOT / KnownKeys) -- Succeeded only on a
#       clean HTTP 200 "ok" with zero snapshotCropFailures/matureRowFailures;
#       otherwise Failed with a human-readable counts summary, so a crop
#       failing every night is visible in the admin Logs hub rather than
#       hidden behind a 200 status. FAIL-SOFT (PRD 3.7) at TWO layers: the
#       script itself always exits 0 (a snapshot failure only ever produces a
#       Failed IngestionRuns row, never a non-zero exit), and the shell
#       wrapper's `|| true` is belt-and-suspenders on top of that -- this step
#       can never fail the Job. FORECAST_SNAPSHOTS_ENABLED=false (env below)
#       skips the HTTP call entirely and records a Skipped row instead --
#       never silent. If build_features.py itself failed, this step never
#       runs at all that night (pending ForecastSnapshots rows simply catch up
#       on the next successful night, by the service's own design).
#
# Sequencing is expressed as initContainers (k8s runs them strictly in order,
# each must exit 0 before the next starts) with build_features as the main
# container. backoffLimit: 0 — a failed step must NOT be blindly re-run
# (re-ingesting/half-done state needs eyes, and run-daily.sh never retried
# either).
#
# BATCH ID: run-daily.sh threads ONE uuid through ingestion
# (Ingestion__BatchId) and verify (--batch-id) so IngestionRuns and
# IngestionVerifications rows join up in the admin runs-log UI. Init
# containers can't share env vars, so the first init container writes the
# uuid to an emptyDir volume (/shared/batch_id) and those two steps read it
# via a small sh -c wrapper. The other steps don't take a batch id — same as
# the script.
#
# RESOURCES: conservative, hand-picked defaults (no metrics-server on this
# cluster, so not autoscaler-derived) -- see k8s/README.md "Resource sizing"
# for the measurements and reasoning behind each tier. Trivial shell steps get
# a small fixed footprint; python steps that only do light DB I/O get a
# shared tier; build-features (loads the full history via pandas AND now
# runs the qa_features check suite in-process -- re-reads the full
# CropFeatureDaily table plus a TC5 double feature rebuild) gets the
# heaviest pipeline tier.
#
# SECURITY CONTEXT: forecast-ingestion already runs as the image's built-in
# non-root 'app' user (uid 1654, same as forecast-api -- see
# AgriForecast.Ingestion/Dockerfile). agriforecast-ml (python:3.12-slim) has
# NO non-root user baked in -- verified empirically (`docker run --rm
# --entrypoint id agriforecast-ml:latest` -> uid=0(root)) -- so runAsNonRoot
# is honestly NOT set for those containers; forcing it would crash-loop every
# python step. They still get allowPrivilegeEscalation:false + capabilities
# drop ALL, which doesn't require non-root. Making the ML image non-root is a
# separate follow-up (Dockerfile surgery: add a user, chown /app, verify pip
# packages + shap/xgboost still load).
#
# LIVE SCHEDULE (suspend: false). The cutover happened 2026-07-26: launchd is
# retired and this CronJob is the production schedule. The manifest must say
# suspend: false because `kubectl apply` overwrites any live patch — an apply
# from a manifest still saying true silently re-suspends the schedule (this
# bit us the very first night: a config-only apply turned the pipeline off).
# The generous startingDeadlineSeconds means a machine asleep at 21:00 that
# wakes within 6h still runs: a late run backfills fine (the DEC fetch returns
# full history per pass), but a day DEC published while we never ran at all is
# a day of freshness lost until the next run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-pipeline
  namespace: agriforecast
  labels:
    app: daily-pipeline
    app.kubernetes.io/part-of: agriforecast
spec:
  schedule: "0 21 * * *"
  timeZone: "Asia/Colombo"
  suspend: false # live since the 2026-07-26 cutover — see header
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600 # 6h catch-up window for a sleeping machine
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5 # keep failures around for post-mortems
  jobTemplate:
    spec:
      backoffLimit: 0 # a failed step needs eyes, not a blind retry
      activeDeadlineSeconds: 7200 # hard 2h ceiling on the whole run
      template:
        metadata:
          labels:
            app: daily-pipeline
        spec:
          restartPolicy: Never
          initContainers:
            # [0] SQL cold-start gate. Bounded TCP poll (5s interval, 300s
            # ceiling) of host.docker.internal:<AGRI_DB_PORT> -- BEFORE
            # anything that touches the DB. Port comes from the same agri-db
            # secret every other DB-touching step already reads (AGRI_DB_PORT
            # below), not hardcoded, so it can never drift from the real port.
            # Uses the already-cached agriforecast-ml image (python's stdlib
            # socket module) rather than pulling busybox, so this needs no
            # network access to Docker Hub to work offline. Exits 1 (visible
            # Job failure) rather than hanging forever if SQL never comes up
            # -- the "dead DB" case run-daily.sh's exit trap used to catch,
            # that a bare CronJob step would otherwise just fail once against
            # a cold DB with backoffLimit: 0 and no retry.
            - name: wait-for-sql
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-c"]
              args:
                - |
                  import os, socket, sys, time
                  host = "host.docker.internal"
                  port = int(os.environ["AGRI_DB_PORT"])
                  timeout_s, interval_s = 300, 5
                  deadline = time.time() + timeout_s
                  while time.time() < deadline:
                      try:
                          with socket.create_connection((host, port), timeout=5):
                              print(f"SQL reachable at {host}:{port}")
                              sys.exit(0)
                      except OSError as e:
                          print(f"SQL not yet reachable at {host}:{port} ({e}); retrying in {interval_s}s...")
                          time.sleep(interval_s)
                  print(f"SQL still unreachable at {host}:{port} after {timeout_s}s -- failing visibly (cold-start gate)")
                  sys.exit(1)
              env:
                - name: AGRI_DB_PORT
                  valueFrom:
                    secretKeyRef: { name: agri-db, key: AGRI_DB_PORT }
              resources:
                requests: { memory: "32Mi", cpu: "10m" }
                limits: { memory: "64Mi", cpu: "100m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
            # [1] Generate the single batch id shared by steps 2 and 4.
            - name: batch-id
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              # set -e + non-empty assertion: a silent write failure here
              # would otherwise thread an EMPTY batch id, which verify treats
              # as "no batch id" — breaking the IngestionRuns <->
              # IngestionVerifications join in the admin runs-log without any
              # visible error.
              args:
                - |
                  set -e
                  cat /proc/sys/kernel/random/uuid > /shared/batch_id
                  test -s /shared/batch_id
                  echo "batch id: $(cat /shared/batch_id)"
              volumeMounts:
                - { name: shared, mountPath: /shared }
              resources:
                requests: { memory: "16Mi", cpu: "10m" }
                limits: { memory: "32Mi", cpu: "50m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
            # [2] Market + weather ingestion (.NET worker; exits after one
            # pass thanks to the baked Ingestion__RunOnce=true, which the
            # exec below preserves).
            - name: ingestion
              image: agriforecast-ingestion:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  export Ingestion__BatchId="$(cat /shared/batch_id)"
                  exec dotnet AgriForecast.Ingestion.dll
              env:
                - name: AGRI_DB_PORT
                  valueFrom:
                    secretKeyRef: { name: agri-db, key: AGRI_DB_PORT }
                - name: AGRI_DB_NAME
                  valueFrom:
                    secretKeyRef: { name: agri-db, key: AGRI_DB_NAME }
                - name: AGRI_DB_USER
                  valueFrom:
                    secretKeyRef: { name: agri-db, key: AGRI_DB_USER }
                - name: AGRI_DB_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: agri-db, key: AGRI_DB_PASSWORD }
                # Same string run-daily.sh assembles; host.docker.internal
                # reaches the host-level sql_server_container (port 1434).
                - name: ConnectionStrings__DefaultConnection
                  value: "Server=host.docker.internal,$(AGRI_DB_PORT);Database=$(AGRI_DB_NAME);User Id=$(AGRI_DB_USER);Password=$(AGRI_DB_PASSWORD);Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True;"
                # --- ML service (mirrors forecast-api.yaml) ---
                # Three of this worker's seven sources (NEWS, HARTI, CBSL) are
                # thin clients over the Python ML service's /admin/* routes.
                # Without these the container falls back to the image-baked
                # 127.0.0.1:8077 and an empty admin key, so those sources
                # cannot reach ml-serving at all — and now that they report
                # honest outcomes, that lands as three Failed rows a night.
                - name: MlService__BaseUrl
                  value: "http://ml-serving:8077" # in-cluster ClusterIP service
                - name: MlService__AdminApiKey
                  valueFrom:
                    secretKeyRef: { name: agri-ml-key, key: ML_ADMIN_API_KEY }
              volumeMounts:
                - { name: shared, mountPath: /shared, readOnly: true }
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1654 # the image's built-in 'app' user ($APP_UID)
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
            # [3] Mirror DAMBULLA_DEC MarketPrices -> PriceObservations.
            - name: mirror-dec
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "mirror_dec_prices.py"]
              envFrom:
                - secretRef: { name: agri-db }
              env:
                - name: AGRI_DB_HOST
                  value: host.docker.internal # overrides the secret's local value
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
            # [4] THE VERIFY GATE — 14-check battery. FAIL (exit 1) stops the
            # pod right here: news, sentiment and build_features never run,
            # exactly like run-daily.sh's set -e abort.
            - name: verify
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - exec python verify_ingestion.py --batch-id "$(cat /shared/batch_id)"
              envFrom:
                - secretRef: { name: agri-db }
              env:
                - name: AGRI_DB_HOST
                  value: host.docker.internal
              volumeMounts:
                - { name: shared, mountPath: /shared, readOnly: true }
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
            # [5] News RSS ingestion (NewsArticles).
            - name: ingest-news
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "ingest_news.py"]
              envFrom:
                - secretRef: { name: agri-db }
              env:
                - name: AGRI_DB_HOST
                  value: host.docker.internal
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
            # [6] Score news sentiment (NewsSentimentDaily).
            - name: score-news
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "score_news.py"]
              envFrom:
                - secretRef: { name: agri-db }
              env:
                - name: AGRI_DB_HOST
                  value: host.docker.internal
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          containers:
            # [7] Rebuild the feature store (CropFeatureDaily). build_features.py
            # itself now runs the qa_features check suite AFTER persisting but
            # BEFORE marking the FEATURE_BUILD run row Succeeded (see
            # build_features.py's `_run_qa_gate`) -- a deliberately failed
            # check flips that SAME row to Failed and re-raises, which is what
            # fails this container non-zero -> Job Failed. QA is still
            # detection, not prevention -- see header comment above. Heaviest
            # pipeline tier: build_features loads the full price/weather/fx/
            # policy/sentiment history via pandas and rebuilds features for
            # ~96 crops; the QA gate re-reads the full CropFeatureDaily table
            # AND rebuilds Beans' 11-year history twice more for the TC5
            # leakage-by-truncation check, all in this one process.
            #
            # [7b] trigger_forecast_snapshot.py runs immediately after, IN THIS
            # SAME CONTAINER, via the shell wrapper below -- see the [6b] header
            # comment above for why it must be after build_features, not before.
            # SENTINEL MARKERS below (SNAPSHOT_TRIGGER_SHELL_START/END) bound the
            # exact guard logic that tests/test_pipeline_snapshot_step_guard.py
            # extracts and executes hermetically -- keep the markers on their own
            # lines if this block is ever edited, or that test's extraction breaks
            # loudly (it asserts the markers are found) rather than silently
            # testing stale text.
            - name: build-features
              image: agriforecast-ml:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                # SNAPSHOT_TRIGGER_SHELL_START
                - |
                  python build_features.py
                  build_status=$?
                  if [ "$build_status" -eq 0 ]; then
                    python trigger_forecast_snapshot.py || true
                  else
                    echo "build_features failed (exit $build_status) -- skipping the forecast-snapshot trigger this run (pending ForecastSnapshots rows catch up the next successful night)" >&2
                  fi
                  exit "$build_status"
                # SNAPSHOT_TRIGGER_SHELL_END
              envFrom:
                - secretRef: { name: agri-db }
              env:
                - name: AGRI_DB_HOST
                  value: host.docker.internal
                # --- forecast-snapshot trigger (trigger_forecast_snapshot.py) ---
                # Same in-cluster base URL and agri-ml-key/ML_ADMIN_API_KEY secret
                # the ingestion container already uses for its ML admin calls
                # (HARTI/CBSL/NEWS) -- see that container's "ML service" env block
                # above. FORECAST_SNAPSHOTS_ENABLED defaults "true" here: PR 0b
                # (the /admin/snapshot-forecasts route + snapshot service) is
                # already live-merged, so this ships enabled from day one, not
                # behind a disabled flag waiting on a later PR.
                - name: ML_SERVICE_BASE_URL
                  value: "http://ml-serving:8077" # in-cluster ClusterIP service
                - name: ML_ADMIN_API_KEY
                  valueFrom:
                    secretKeyRef: { name: agri-ml-key, key: ML_ADMIN_API_KEY }
                - name: FORECAST_SNAPSHOTS_ENABLED
                  value: "true"
              resources:
                requests: { memory: "512Mi", cpu: "250m" }
                limits: { memory: "1536Mi", cpu: "1000m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: shared
              emptyDir: {}
