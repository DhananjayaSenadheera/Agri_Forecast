# ML serving (FastAPI, agriforecast-ml:latest, uvicorn :8077).
#
# DELIBERATELY CLUSTER-INTERNAL: the /predict routes are unauthenticated by
# design (only /admin/* checks X-API-Key), so network placement IS the
# security boundary. ClusterIP only — no NodePort, no Ingress. The only
# consumer is the forecast-api pod via http://ml-serving:8077.
#
# MODELS ARE NOT IN THE IMAGE. serving loads the promoted model at startup
# (registry.load_promoted) from /app/models, mounted below via hostPath from
# the repo working copy. CLOUD-PORTABILITY NOTE: hostPath only works because
# this is single-node Docker Desktop with the repo on the same machine; in a
# real cluster this becomes a PersistentVolumeClaim or object storage
# (S3/Azure Blob) populated by the training job — swap the volume, nothing
# else changes.
#
# RESOURCES: no metrics-server on this cluster; sized from `docker stats` on
# the live pod (idle with model loaded: ~307MiB — heaviest of the three
# Deployments, since this is the one holding the unpickled xgboost model +
# shap in memory). request/limit give ~1.7x/~5x headroom over that idle
# baseline for concurrent prediction requests.
#
# SECURITY CONTEXT: agriforecast-ml is python:3.12-slim with NO non-root user
# baked in -- verified empirically (`docker run --rm --entrypoint id
# agriforecast-ml:latest` -> uid=0(root)). runAsNonRoot is honestly left
# unset rather than forced (it would crash-loop the pod on the readOnly model
# mount + normal app writes). Still hardened where it doesn't require
# non-root: allowPrivilegeEscalation:false + capabilities drop ALL. Making
# this image non-root is a separate follow-up (Dockerfile surgery: add a
# user, chown /app, re-verify pip/xgboost/shap still import).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-serving
  namespace: agriforecast
  labels:
    app: ml-serving
    app.kubernetes.io/part-of: agriforecast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-serving
  template:
    metadata:
      labels:
        app: ml-serving
    spec:
      containers:
        - name: ml-serving
          image: agriforecast-ml:latest
          imagePullPolicy: IfNotPresent # local image, no registry
          ports:
            - containerPort: 8077
          envFrom:
            - secretRef:
                name: agri-db # AGRI_DB_* (host/port/name/user/password)
            - secretRef:
                name: agri-ml-key # ML_ADMIN_API_KEY (guards /admin/* routes)
          env:
            # Explicit env beats envFrom: the secret stores whatever the local
            # .env has for the host (typically localhost); inside the cluster
            # the host-level sql_server_container is reached via
            # host.docker.internal (host port 1434 from AGRI_DB_PORT).
            - name: AGRI_DB_HOST
              value: host.docker.internal
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true # serving only reads; training/promotion happen outside the cluster
          # The promoted model is unpickled at import time, BEFORE uvicorn
          # binds the port. startupProbe owns that window (up to 150s) so a
          # slow model load can't be mistaken for a hung process; liveness
          # only takes over once startup has succeeded.
          startupProbe:
            httpGet:
              path: /health
              port: 8077
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8077
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8077
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1536Mi", cpu: "1000m" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: models
          hostPath:
            # Docker Desktop shares /Users into its VM, so this resolves.
            path: /Users/dhananjayasenadheera/Projects/Agri_Forecast/Project/Agri_Forecast/src/AgriForecast.ML/models
            type: Directory # fail fast at scheduling if the path is missing
---
apiVersion: v1
kind: Service
metadata:
  name: ml-serving
  namespace: agriforecast
  labels:
    app: ml-serving
    app.kubernetes.io/part-of: agriforecast
spec:
  type: ClusterIP # internal-only on purpose — see header comment
  selector:
    app: ml-serving
  ports:
    - name: http
      port: 8077
      targetPort: 8077
